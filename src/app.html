<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- This shell is what a crawler with no JavaScript sees, and the app renders
		     client-side (ssr = false) — so lang and description have to ship with a
		     value, in English. +layout.svelte rewrites both to the reader's language
		     once it boots. Do not move them into <svelte:head>: that would leave the
		     static HTML with no description at all. -->
		<meta name="description" content="BJJ Match Scoreboard - Real-time Brazilian Jiu-Jitsu scoring via Nostr" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Barlow+Condensed:wght@500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<title>🥋 Choke Scoreboard</title>
		<!-- The theme, before anything paints.
		     The app renders client-side, so this shell is all there is on screen
		     until the bundle boots. Applying a saved light theme after that boots
		     is a black flash on a white page, on every load — and this app gets
		     reloaded all day on a projector.
		     The key and the class are literals because nothing of ours has loaded
		     yet to import them from src/lib/theme.ts; theme.test.ts reads this file
		     and asserts they still match. The try/catch is not decoration: reading
		     localStorage throws outright in Safari's private mode and with cookies
		     blocked, and an uncaught error here runs before the bundle and would
		     take the whole boot with it. -->
		<script>
			try {
				if (localStorage.getItem('choke:theme') === 'light') {
					document.documentElement.classList.add('light');
				}
			} catch (err) {
				console.warn('Could not read the saved theme:', err);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
